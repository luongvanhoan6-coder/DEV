<html lang="vi">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ong Vàng – Quản trị lợi nhuận & dòng tiền</title>
<meta name="description" content="Phần mềm quản trị lợi nhuận và dòng tiền Ong Vàng (bản DEMO).">
<meta name="robots" content="noindex">

<style>:root{--g:#0f5a2c;--g2:#0b3d1e;--g3:#1c7a42;--gold:#d9a21b;--bg:#f2f6f2;--card:#fff;--ink:#17261c;--mut:#617066;--line:#e3e9e3;--red:#c0392b;--amber:#b7791f;--blue:#1d6fa5;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.boot{padding:40px;text-align:center;color:var(--mut)}
.muted{color:var(--mut)}.grow{flex:1}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}.right{text-align:right}.center{text-align:center}
/* layout */
.layout{display:flex;min-height:100vh}
.side{width:224px;flex:none;background:linear-gradient(180deg,var(--g2),#0a2e17);color:#dfeee3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding:14px 10px}
.logo{display:flex;gap:9px;align-items:center;padding:4px 8px 16px}.logo span{display:flex;flex-direction:column;line-height:1.05}.logo b{font-size:19px;color:#fff;letter-spacing:.3px}.logo small{font-size:7.5px;color:#e6b422;font-weight:600}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13px;color:#d5e6d9;position:relative}.nav-i i{font-style:normal;width:20px;text-align:center}
.nav-i:hover{background:#ffffff14}.nav-i.on{background:#fff;color:var(--g);font-weight:700}
.dot{font-style:normal;background:#e74c3c;color:#fff;border-radius:99px;font-size:10px;min-width:17px;height:17px;display:inline-grid;place-items:center;padding:0 4px;margin-left:auto}
.side-foot{padding:12px 8px 4px;font-size:11px}.demo{display:inline-block;background:var(--gold);color:#3a2a00;font-weight:800;border-radius:6px;padding:2px 8px;font-size:10px;margin-bottom:3px}.side-foot small{display:block;color:#9fc0a8}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.gs{position:relative;width:min(380px,40vw)}.gs input{width:100%;padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:#f7faf7;font:inherit}
.gs-res{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #0002;overflow:hidden;z-index:30}.gs-i{display:block;padding:9px 14px;font-size:13px}a.gs-i:hover{background:#f0f6f1}.gs-i small{display:block;color:var(--mut);font-size:10px;text-transform:uppercase}
.bell{position:relative;font-size:18px;padding:4px 8px}.bell .dot{position:absolute;top:-4px;right:-2px;margin:0}
.me{display:flex;gap:10px;align-items:center}.me small{display:block;color:var(--mut);font-size:11px}.me b{font-size:13px}.av{width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700}
.burger{display:none;background:none;border:0;font-size:22px;color:var(--g)}
.main{padding:22px;flex:1}
.foot{padding:14px 22px;font-size:11px;color:var(--mut);border-top:1px solid var(--line)}
.scrim{display:none}
/* page */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.ph h1{font-size:24px;color:var(--g2);font-weight:800}.ph p{color:var(--mut);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}.tab{background:none;border:0;padding:10px 16px;font-size:13.5px;font-weight:500;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}.tab.on{color:var(--g);border-color:var(--g);font-weight:700}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 3px #0001;border:1px solid var(--line);min-width:0}.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}.card-h h3{font-size:15px;color:var(--g2)}
.kpi{display:block;border-radius:var(--r);padding:12px 14px;border:1px solid transparent;transition:.15s}a.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px #0002}
.kpi-l{font-size:12px;color:var(--mut)}.kpi-v{font-size:22px;font-weight:800;margin:2px 0}.kpi-s{font-size:11px;color:var(--mut)}
.kpi.green{background:#e8f5ec;border-color:#cfe8d6}.kpi.green .kpi-v{color:var(--g)}.kpi.blue{background:#e6f1fa;border-color:#cde2f2}.kpi.blue .kpi-v{color:var(--blue)}.kpi.amber{background:#fdf3de;border-color:#f3e0b0}.kpi.amber .kpi-v{color:var(--amber)}.kpi.red{background:#fdeaea;border-color:#f5cfcf}.kpi.red .kpi-v{color:var(--red)}.kpi.gray{background:#f1f3f1}

.filters{display:flex;gap:8px;flex-wrap:wrap}
select,input,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
.filters select,.dt-bar select,.dt-bar input.search{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{background:var(--g);color:#fff;border:1px solid var(--g);border-radius:9px;padding:9px 16px;font-weight:600;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px}.btn:hover{background:var(--g2)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--g);border-color:#cfd8d0}.btn.ghost:hover{background:#f0f6f1}.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1d00}.btn.danger{background:var(--red);border-color:var(--red)}.btn.sm{padding:5px 10px;font-size:12px}
.link{background:none;border:0;color:var(--g);text-decoration:underline;font-size:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge.green{background:#dff3e5;color:#13703a}.badge.amber{background:#fdf0d0;color:#92600f}.badge.red{background:#fbdcdc;color:#a52a2a}.badge.darkred{background:#f4b8b8;color:#7d1414}.badge.blue{background:#dcecf8;color:#175d8e}.badge.gray{background:#e9ede9;color:#4a574e}
/* table */
.dt-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.dt-bar input.search{min-width:220px;flex:1;max-width:340px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}.tbl{width:100%;border-collapse:collapse;min-width:560px}
.tbl th{background:#f3f7f3;text-align:left;padding:10px 12px;font-size:12px;color:#3e4f43;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}.tbl th.sortable{cursor:pointer}.tbl th.sortable:hover{background:#e9f1ea}
.tbl td{padding:10px 12px;border-bottom:1px solid #eef2ee;font-size:13px;vertical-align:middle}.tbl tr:last-child td{border-bottom:0}.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#f6faf6}.tbl .right{text-align:right}.tbl .num{font-variant-numeric:tabular-nums;text-align:right}
.tbl tr.rowred td{background:#fff3f3}.tbl tr.rowamber td{background:#fff9ea}
.dt-pg{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap}.pager{display:flex;gap:4px;align-items:center}.pg{min-width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:12px}.pg.on{background:var(--g);color:#fff;border-color:var(--g)}.pg:disabled{opacity:.4}
.dt-foot{margin-top:8px;font-size:12px;color:var(--mut)}
.red-t{color:var(--red);font-weight:600}.green-t{color:#13703a}.amber-t{color:var(--amber)}
.state{padding:26px;text-align:center;color:var(--mut);border-radius:10px;background:#fafcfa}.state.error{background:#fdeaea;color:#8d2323}.state.loading{background:transparent}
/* charts */
.chart{width:100%;height:auto}.chart .grid{stroke:#e6ece6;stroke-width:1}.chart .axis{font-size:10px;fill:#6b7a70}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:6px;color:#3e4f43}.legend i,.dn-leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px}.chart-u{font-size:10.5px;color:var(--mut);margin-top:4px}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.dn-leg{list-style:none;display:grid;gap:5px;flex:1;min-width:150px;font-size:12.5px}.dn-leg li{display:flex;align-items:center}.dn-leg b{margin-left:auto}.dn-c{font-size:14px;font-weight:800;fill:var(--g2)}.dn-s{font-size:8px;fill:var(--mut)}
/* alert items */
.alerts{display:grid;gap:8px}.al{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);align-items:flex-start}.al .sev{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}.sev.high{background:var(--red)}.sev.med{background:#e08e0b}.sev.low{background:var(--blue)}.al b{font-size:13px}.al p{font-size:12px;color:var(--mut)}
/* forms & modal */
.overlay{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:100;padding:14px}
.modal{background:#fff;border-radius:14px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px #0006}.modal.wide{width:min(900px,100%)}.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}.modal-h h3{color:var(--g2);font-size:16px}.x{background:none;border:0;font-size:24px;color:var(--mut)}.modal-b{padding:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fld{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:#33453a}.fld.full,.full{grid-column:1/-1}.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid #cdd6ce;border-radius:8px;font-weight:400;background:#fff;width:100%}.fld input:focus,.fld select:focus,.fld textarea:focus,.gs input:focus{outline:2px solid #7fc196;border-color:var(--g)}.fld small{font-weight:400;color:var(--mut)}
.form-err{grid-column:1/-1;color:var(--red);font-size:13px;min-height:0}.form-err:empty{display:none}.note{font-size:12px;color:var(--mut)}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:200}.toast{background:#143d24;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px #0004;font-size:13px;max-width:360px}.toast.err{background:#a12a2a}
.cost-box{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}.cost-box>div{border-radius:10px;padding:12px 14px}.cost-box .a{background:#e3f4e7}.cost-box .b{background:#e5f0fa}.cost-box b{display:block;font-size:22px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow:auto;padding:4px}.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:13px;white-space:pre-wrap}.msg.u{align-self:flex-end;background:#d7ecf9}.msg.a{align-self:flex-start;background:#f1f5f1;border:1px solid var(--line)}.msg small{display:block;color:var(--mut);margin-top:6px}
.chip{background:#fff;border:1px solid #cfd8d0;border-radius:99px;padding:6px 12px;font-size:12px;color:var(--g);margin:2px}.chip:hover{background:#f0f6f1}
.src{display:inline-block;font-size:10.5px;background:#eef3ee;border-radius:5px;padding:1px 6px;margin-right:4px;color:#47594c}

/* ===== Popup TRỢ LÝ XINH ĐẸP ===== */
.ag-root{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.ag-fab{display:flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:6px 16px 6px 6px;background:linear-gradient(135deg,#ff7eb3,#f1b21c);color:#fff;font-weight:800;font-size:13px;letter-spacing:.3px;box-shadow:0 8px 24px #d6537f55;animation:agpulse 2.6s infinite}
.ag-fab:hover{filter:brightness(1.05)}.ag-root.open .ag-fab{animation:none}
@keyframes agpulse{0%,100%{box-shadow:0 8px 24px #d6537f55}50%{box-shadow:0 8px 32px #f1b21caa}}
.ag-av{display:inline-block;width:38px;height:38px;border-radius:50%;overflow:hidden;background:#fff;flex:none;border:2px solid #fff}.ag-av.lg{width:44px;height:44px}
.ag-panel{width:392px;max-width:calc(100vw - 24px);height:min(600px,calc(100vh - 110px));background:#fff;border-radius:18px;box-shadow:0 20px 60px #0004;display:flex;flex-direction:column;overflow:hidden;border:1px solid #f3d6e3}
.ag-panel[hidden]{display:none}
.ag-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,#ff7eb3,#f1b21c);color:#fff}.ag-h b{display:block;font-size:14px;letter-spacing:.4px}.ag-h small{font-size:11px;opacity:.95}
.ag-x{background:#ffffff33;border:0;color:#fff;border-radius:8px;width:30px;height:30px;font-size:14px}.ag-x:hover{background:#ffffff55}
.ag-list{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff8fb}
.ag-msg{max-width:90%;padding:9px 13px;border-radius:16px;font-size:13px;line-height:1.5;word-wrap:break-word}.ag-msg p{margin:0}.ag-msg ul{margin:4px 0 4px 18px}.ag-sp{height:6px}
.ag-msg.user{align-self:flex-end;background:linear-gradient(135deg,#0f5a2c,#1c7a42);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.ag-msg.bot{align-self:flex-start;background:#fff;border:1px solid #f3d6e3;border-bottom-left-radius:4px}.ag-msg.err{background:#fdeaea;border-color:#f5cfcf;color:#8d2323}
.ag-dots i{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;background:#e0558a;animation:agb 1s infinite}.ag-dots i:nth-child(2){animation-delay:.15s}.ag-dots i:nth-child(3){animation-delay:.3s}@keyframes agb{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

.ag-send{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,#ff7eb3,#f1b21c);color:#fff;font-size:16px}.ag-send:disabled{opacity:.5}
.ag-foot{font-size:10px;color:var(--mut);padding:0 14px 8px;background:#fff}
